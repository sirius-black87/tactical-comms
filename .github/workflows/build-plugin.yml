name: Build ATAK plugin

on:
  push:
    paths:
      - 'plugin/**'
      - '.github/workflows/build-plugin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Cache ATAK SDK
        uses: actions/cache@v4
        with:
          path: |
            plugin/sdk/main.jar
            plugin/sdk/atak-gradle-takdev.jar
            plugin/sdk/atak.apk
            plugin/sdk/VERSION.txt
          key: atak-civ-sdk-4.6.0.5

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('plugin/**/*.gradle', 'plugin/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Download the public ATAK-CIV SDK
        run: ./setup-sdk.sh

      - name: Build plugin APK
        run: ./gradlew --no-daemon --stacktrace assembleCivDebug

      - name: Collect files
        run: |
          mkdir -p out
          cp app/build/outputs/apk/civ/debug/*.apk out/
          ls -la out

      - name: Upload plugin APK
        uses: actions/upload-artifact@v4
        with:
          name: tactical-comms-plugin
          path: plugin/out/*.apk
          if-no-files-found: error

      - name: Upload ATAK developer build (install this on the phones instead of the Play Store ATAK)
        uses: actions/upload-artifact@v4
        with:
          name: atak-developer-build-4.6.0.5
          path: plugin/sdk/atak.apk
          compression-level: 0
          if-no-files-found: error
