# Deployment behind a domain name: Caddy obtains a public TLS certificate automatically.
# Usage: set DOMAIN in .env, then: docker compose -f docker-compose.domain.yml up -d --build
services:
  comms:
    build: .
    restart: unless-stopped
    environment:
      ACCESS_KEY: ${ACCESS_KEY:?set ACCESS_KEY in .env}
      MAX_FILE_MB: ${MAX_FILE_MB:-200}
      FILE_TTL_HOURS: ${FILE_TTL_HOURS:-72}
      PTT_MAX_SECONDS: ${PTT_MAX_SECONDS:-90}
    volumes:
      - comms-data:/data

  # TLS termination with automatic Let's Encrypt certificates
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [comms]

volumes:
  comms-data:
  caddy-data:
